---
- name: Configure Cisco Routers
  hosts: cisco
  connection: network_cli
  gather_facts: no

  tasks:
    - name: Configure MOTD Banner
      cisco.ios.ios_banner:
        banner: motd
        text: |
          ---------------------------------------
          WARNING: Authorized Access Only for G3nIu5
          Managed by Ansible & Jenkins with GitHub
          Automation with Webhook + ngrock & GNS3 + Cisco
          Tested by 19th Feb 2026 ver2
          ---------------------------------------
        state: present

    - name: Configure Loopback 100 
      cisco.ios.ios_config:
        lines:
          - description Configured by Ansible
          - ip address 192.168.100.1 255.255.255.255
          - no shutdown
        parents: interface Loopback100
        
    - name: Configure Loopback 200 
      cisco.ios.ios_config:
        lines:
          - description Configured by Ansible + gitpull
          - ip address 192.168.200.1 255.255.255.255
          - no shutdown
        parents: interface Loopback200

    - name: Configure Loopback 300
      cisco.ios.ios_config:
        lines:
          - description Configured by Ansible + gitpull + jenkins
          - ip address 192.168.30.1 255.255.255.255
          - no shutdown
        parents: interface Loopback300
    
    - name: Adding a Static Route
      cisco.ios.ios_config:
        lines:
          - ip route 192.168.150.0 255.255.255.0 null0
          - ip route 192.168.250.0 255.255.255.0 null0
          - ip route 172.16.10.0 255.255.255.0 null0
          - ip route 172.16.11.0 255.255.255.0 null0
          - ip route 172.16.12.0 255.255.255.0 null0
          - ip route 172.16.13.0 255.255.255.0 null0
      # 'parents' enters the interface mode
      # 'lines' executes the commands inside that mode

    - name: Save Configuration
      cisco.ios.ios_config:
        save_when: modified
